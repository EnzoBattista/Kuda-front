<div class="admin-page">
  <div class="admin-header">
    <div class="admin-header-top">
      <h2>Panel de administrador</h2>
      <div class="admin-header-right">
        <span class="current-user" *ngIf="currentUser">
          <strong>{{ currentUser.nombre }} {{ currentUser.apellido }}</strong>
          <span class="role-badge">{{ currentUser.rol.nombre }}</span>
        </span>
      </div>
    </div>

    <div class="tabs">
      <button (click)="setTab('actividades')" [class.active]="tab === 'actividades'">Actividades</button>
      <button (click)="setTab('usuarios')" [class.active]="tab === 'usuarios'">Usuarios</button>
      <button (click)="setTab('clases')" [class.active]="tab === 'clases'">Clases</button>
      <button (click)="setTab('profesores')" [class.active]="tab === 'profesores'">Profesores</button>
    </div>
  </div>

  <app-actividades-list *ngIf="tab === 'actividades'"></app-actividades-list>

  <!-- USUARIOS (HU "Listar usuarios" + "Filtrar usuarios" + atajo a "Editar usuario") -->
  <app-usuarios-list *ngIf="tab === 'usuarios'"></app-usuarios-list>

  <app-clases-list *ngIf="tab === 'clases'"></app-clases-list>

  <!-- PROFESORES -->
  <section *ngIf="tab === 'profesores'" class="card">
    <div class="card-head">
      <h3>Profesores</h3>
      <div class="card-head-actions">
        <button class="btn-action" (click)="onCreateProfesor()">+ Registrar profesor</button>
        <button (click)="refreshProfesores()">Refrescar</button>
      </div>
    </div>

    <p class="error" *ngIf="error.profesores">{{ error.profesores }}</p>
    <p class="muted" *ngIf="loading.profesores">Cargando…</p>

    <div class="grid grid-2">
      <label>
        <span>Nombre</span>
        <input [(ngModel)]="createProfesor.nombre" />
      </label>
      <label>
        <span>Apellido</span>
        <input [(ngModel)]="createProfesor.apellido" />
      </label>
      <label>
        <span>DNI</span>
        <input [(ngModel)]="createProfesor.dni" />
      </label>
      <label>
        <span>Actividades (IDs, separados por coma)</span>
        <input placeholder="Ej: 1,2,3" [(ngModel)]="createProfesor.actividadesCsv" />
      </label>
    </div>

    <div class="table">
      <div class="row head">
        <div>ID</div>
        <div>Apellido</div>
        <div>Nombre</div>
        <div>DNI</div>
      </div>
      <div class="row" *ngFor="let p of profesores">
        <div>{{ p.id }}</div>
        <div>{{ p.apellido }}</div>
        <div>{{ p.nombre }}</div>
        <div>{{ p.dni }}</div>
      </div>
    </div>
  </section>
</div>
