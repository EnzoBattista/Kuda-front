<header class="app-header" *ngIf="!hideHeader">
  <div class="app-header-inner">
    <a [routerLink]="logoPath" class="brand" aria-label="Ir al inicio">
      <img src="LogoSolo.png" alt="" aria-hidden="true" class="logo-slot" style="width:42px;height:42px;object-fit:contain;border:none;background:none;" />
      <div class="brand-text">
        <strong>CEF Actividades</strong>
        <span>Centro de bienestar</span>
      </div>
    </a>

    <nav class="main-nav" aria-label="Navegación principal">
      <ng-container *ngIf="auth.isLoggedIn(); else noLogueado">
        <ng-container *ngIf="!auth.isAdministrativo()">

          <a class="nav-link" routerLink="/clases" routerLinkActive="nav-link-active">Clases</a>
          <a class="nav-link" routerLink="/mis-reservas" routerLinkActive="nav-link-active">Ver mis reservas actuales</a>
        </ng-container>
        <a class="nav-link" routerLink="/mi-informacion" routerLinkActive="nav-link-active">Mi información</a>
        <button class="nav-link nav-logout" (click)="logout()">Cerrar sesión</button>
      </ng-container>
      <ng-template #noLogueado>
        <a class="nav-link" routerLink="/login" routerLinkActive="nav-link-active">Ingresar</a>
      </ng-template>
    </nav>
  </div>
</header>

<main class="app-main">
  <button class="btn-global-back" *ngIf="showBackButton" (click)="goBack()" aria-label="Volver atrás">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"></path>
      <path d="M12 19l-7-7 7-7"></path>
    </svg>
    <span>Volver</span>
  </button>
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <div class="container">
    <p>&copy; 2026 CEF Actividades. Todos los derechos reservados.</p>
  </div>
</footer>
