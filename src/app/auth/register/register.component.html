<div class="login-page">
  <div class="aurora-bg" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container login-container" style="padding-top: 1.25rem;">
    <div class="card card-pad login-card">
    <h2>Registro de cliente</h2>
    <p class="help">
      Completá tus datos. Debés ser mayor de 14 años para registrarte.
    </p>

    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-row form-row-2">
        <div class="field">
          <div class="label">Nombre</div>
          <input class="control" formControlName="nombre" required />
        </div>

        <div class="field">
          <div class="label">Apellido</div>
          <input class="control" formControlName="apellido" required />
        </div>
      </div>

      <div class="form-row form-row-2">
        <div class="field">
          <div class="label">DNI</div>
          <input class="control" formControlName="dni" inputmode="numeric" required />
        </div>

        <div class="field">
          <div class="label">Teléfono</div>
          <input class="control" formControlName="telefono" inputmode="tel" required />
        </div>
      </div>

      <div class="field">
        <div class="label">Email</div>
        <input class="control" type="email" formControlName="email" autocomplete="email" required />
      </div>

      <div class="form-row form-row-2">
        <div class="field">
          <div class="label">Género</div>
          <select class="control" formControlName="genero" required>
            <option value="femenino">Femenino</option>
            <option value="masculino">Masculino</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="field">
          <div class="label">Fecha de nacimiento</div>
          <input
            class="control"
            type="date"
            formControlName="fechaNacimiento"
            required
          />
        </div>
      </div>

      <div class="field">
        <div class="label">Ficha médica</div>
        <input
          class="control"
          type="file"
          (change)="onFichaMedicaSelected($event)"
          required
        />
        <div class="help" *ngIf="fichaMedicaFileName">Archivo: {{ fichaMedicaFileName }}</div>
      </div>

      <div class="form-row form-row-2">
        <div class="field">
          <div class="label">Contraseña</div>
          <input class="control" type="password" formControlName="password" autocomplete="new-password" required />
        </div>

        <div class="field">
          <div class="label">Confirmar contraseña</div>
          <input class="control" type="password" formControlName="confirmPassword" autocomplete="new-password" required />
        </div>
      </div>


      <div class="form-actions">
        <button
          class="btn btn-primary"
          type="submit"
          [disabled]="isSubmitting || form.invalid"
        >
          {{ isSubmitting ? 'Registrando…' : 'Registrarse' }}
        </button>
      </div>
    </form>

    <p class="help" style="margin-top: 1rem;">
      ¿Ya tenés cuenta? <a routerLink="/login"><strong>Iniciá sesión</strong></a>
    </p>
  </div>
</div>
