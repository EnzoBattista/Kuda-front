<div class="welcome-page">
  <div class="glow-layer"></div>

  <canvas #particleCanvas class="particle-canvas"></canvas>

  <main class="welcome-content">
    <div class="logo-display">
      <img src="Logo.png" alt="Logo CEF Centro de Actividades" class="logo-img" />
    </div>

    <a routerLink="/login" class="btn btn-danger welcome-btn">Iniciar sesión</a>

    <div class="welcome-register">
      <span class="welcome-register-text">¿Todavía no tenés sesión?</span>
      <a routerLink="/registro" class="welcome-register-link">Registrate</a>
    </div>
  </main>
</div>
