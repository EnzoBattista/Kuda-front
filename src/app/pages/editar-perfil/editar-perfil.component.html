<div class="container" style="padding-top: 2rem; max-width: 640px;">
  <div class="card card-pad" *ngIf="isLoading">
    <p class="help">Cargando tu perfil…</p>
  </div>

  <div class="card card-pad" *ngIf="!isLoading">
    <h2>Modificar datos personales</h2>
    <p class="help">Actualizá tu información personal.</p>

    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" ngNativeValidate>
      <div class="form-row form-row-2">
        <div class="field">
          <div class="label">Nombre</div>
          <input
            class="control"
            formControlName="nombre"
            required
            [attr.aria-invalid]="submitted && form.controls.nombre.invalid ? 'true' : 'false'"
          />
          <div class="error-text" *ngIf="submitted && form.controls.nombre.hasError('required')">
            El nombre es obligatorio.
          </div>
        </div>

        <div class="field">
          <div class="label">Apellido</div>
          <input
            class="control"
            formControlName="apellido"
            required
            [attr.aria-invalid]="submitted && form.controls.apellido.invalid ? 'true' : 'false'"
          />
          <div class="error-text" *ngIf="submitted && form.controls.apellido.hasError('required')">
            El apellido es obligatorio.
          </div>
        </div>
      </div>

      <div class="form-row form-row-2" *ngIf="!auth.isAdministrativo()">
        <div class="field">
          <div class="label">Género</div>
          <select class="control" formControlName="genero" required>
            <option value="femenino">Femenino</option>
            <option value="masculino">Masculino</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="field">
          <div class="label">Fecha de nacimiento</div>
          <input
            class="control"
            type="date"
            formControlName="fechaNacimiento"
            [max]="maxFechaNacimiento"
            required
            [attr.aria-invalid]="submitted && form.controls.fechaNacimiento.invalid ? 'true' : 'false'"
          />
          <div class="error-text" *ngIf="submitted && form.controls.fechaNacimiento.hasError('required')">
            La fecha de nacimiento es obligatoria.
          </div>
          <div class="error-text" *ngIf="submitted && form.controls.fechaNacimiento.hasError('menorDeEdad')">
            El usuario debe ser mayor de 14 años
          </div>
        </div>
      </div>

      <div class="field">
        <div class="label">Teléfono</div>
        <input
          class="control"
          formControlName="telefono"
          inputmode="tel"
        />
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Guardando…' : 'Guardar cambios' }}
        </button>
      </div>
    </form>
  </div>
</div>
