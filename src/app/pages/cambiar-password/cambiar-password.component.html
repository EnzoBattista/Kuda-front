<div class="container" style="padding-top: 1.25rem; max-width: 640px;">
  <div class="card card-pad">
    <h2>Cambiar contraseña</h2>
    <p class="help">Por seguridad, ingresá tu contraseña actual y luego la nueva.</p>

    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <div class="label">Contraseña actual</div>
        <input
          class="control"
          type="password"
          formControlName="passwordActual"
          autocomplete="current-password"
        />
      </div>

      <div class="field">
        <div class="label">Nueva contraseña</div>
        <input
          class="control"
          type="password"
          formControlName="passwordNueva"
          autocomplete="new-password"
        />
      </div>

      <div class="field">
        <div class="label">Confirmar nueva contraseña</div>
        <input
          class="control"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit" [disabled]="isSubmitting || form.invalid">
          {{ isSubmitting ? 'Guardando…' : 'Cambiar contraseña' }}
        </button>
      </div>
    </form>
  </div>
</div>
