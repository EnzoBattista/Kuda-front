<main class="catalog-main-content">
  <div class="catalog-head">
    <h1>Actividades</h1>
    <p class="catalog-subtitle">
      Elegí una actividad y reservá tu lugar en las clases disponibles.
    </p>
  </div>

  <section class="table-block">
    <div class="card card-pad empty-state" *ngIf="isLoading">
      <p class="help">Cargando actividades…</p>
    </div>

    <p class="form-error" *ngIf="loadError">{{ loadError }}</p>

    <p class="help catalog-empty" *ngIf="!isLoading && !loadError && actividades.length === 0">
      Actualmente no hay actividades disponibles
    </p>

    <div class="actividades-grid" *ngIf="!isLoading && actividades.length > 0">
      <article class="card card-pad actividad-card" *ngFor="let actividad of actividades">
        <h2 class="actividad-nombre">{{ actividad.nombre }}</h2>
        <p class="actividad-desc" *ngIf="actividad.descripcion">{{ actividad.descripcion }}</p>
        <p class="actividad-precio" *ngIf="actividad.precio">
          Desde ${{ actividad.precio | number:'1.0-0' }}
        </p>
        <a
          class="btn btn-primary"
          [routerLink]="['/clases']"
          [queryParams]="{ actividad: actividad.nombre }"
        >
          Ver horarios / Inscribirse
        </a>
      </article>
    </div>
  </section>
</main>
